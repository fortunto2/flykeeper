name: Flykeeper
options:
  bundleIdPrefix: co.superduperai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  FlyKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode. The C engine is a single mutable object reached through an
    # actor, and full data-race checking is what keeps that true as the app grows.
    SWIFT_STRICT_CONCURRENCY: complete
    # Expanded by xcodegen from the environment: `make generate` exports TEAM from Makefile.local.
    # A team identifier does not belong in a repository that may go public.
    DEVELOPMENT_TEAM: "${TEAM}"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Flykeeper:
    type: application
    platform: iOS
    sources:
      - path: Sources/Flykeeper
      # Layered app icon (iOS 26+), generated by scripts/make-icon.py. The asset catalogue
      # beside it carries the flattened 1024 for iOS 18, which has no layered format.
      - path: Resources/App.icon
      - path: Resources/Assets.xcassets
      # The fly model: CC0 low-poly "Fly" by Kohyzazi (poly.pizza/m/kCLW4c0kGx), converted by
      # scripts/glb2usdz.py with the wings split so they can beat. See docs/assets.md.
      - path: Resources/Fly.usdz
        buildPhase: resources
      # The real connectome: FlyWire FAFB v783 (CC-BY 4.0, Dorkenwald et al. 2024), exported
      # from codex.flywire.ai and packed by scripts/flywire-import.py. See docs/assets.md.
      - path: Resources/fafb-v783.fcb
        buildPhase: resources
      # Brain surface mesh from navis-flybrains (FLYWIRE template, same µm frame as the
      # cells), exported by trimesh and converted by scripts/glb2usdz.py. See docs/assets.md.
      - path: Resources/BrainShell.usdz
        buildPhase: resources
      # Cell indices by predicted neurotransmitter (from the same Codex export): the reward
      # population the app drives while the fly eats.
      - path: Resources/fafb-v783-populations.json
        buildPhase: resources
      # Decimated arbors of 8 000 cells (all DA + a sample) from the Codex skeletons, packed
      # by scripts/flywire-skeletons.py. See docs/assets.md.
      - path: Resources/fafb-v783-skeletons.fsk
        buildPhase: resources
    dependencies:
      - package: FlyKit
        product: FlyKit
      # Rust connectome engine, built by superduper-dsp/mobile/fly-ios/build-xcframework.sh.
      # Static, so it is linked and not embedded.
      - framework: Vendor/FlyBrain.xcframework
        embed: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.flykeeper
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Flykeeper/Flykeeper-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/FlyBrain.xcframework/ios-arm64/Headers
        # The staticlib ships arm64 simulator only (Apple-Silicon Macs run the sim as arm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: App
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
